[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rsna-knee"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy==2.2.6", "pydicom==3.0.1", "matplotlib==3.10.3"]

[project.optional-dependencies]
test = ["pytest==8.4.1"]

[project.scripts]
knee-audit = "rsna_knee.data.audit:main"
knee-volume = "rsna_knee.preprocessing.dicom:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
